name: Upgrade cars design and search once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cars-design-search-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.event.head_commit.message == 'Run one-time cars design search upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply marketplace changes
        run: python automation/upgrade_cars_marketplace_once.py

      - name: Normalize navigation references
        run: PYTHONPATH=. python automation/unify_navigation.py

      - name: Validate JavaScript and diffs
        run: |
          node --check cars/cars.js
          git diff --check
          grep -q 'global-progress.css?v=20260907-cars2' scripts/global-nav.js
          grep -q 'cars-filter-year-min' cars/index.html
          grep -q 'initImagePicker' cars/cars.js

      - name: Commit directly to main
        run: |
          rm -f .github/workflows/cars-design-search-upgrade-once.yml
          rm -f automation/upgrade_cars_marketplace_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve car marketplace search and UX'
          git pull --rebase origin main
          git push origin HEAD:main
