name: Refine daily article layout

on:
  workflow_run:
    workflows: ["Generate daily fuel article"]
    types: [completed]
  workflow_dispatch:
    inputs:
      article_date:
        description: "Optional date in YYYY-MM-DD. Leave empty to use latest daily article."
        required: false
        type: string

permissions:
  contents: write

jobs:
  refine:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        run: pip install -r requirements-automation.txt

      - name: Refine daily article layout and generate editorial images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          ARTICLE_DATE: ${{ inputs.article_date }}
        run: python -m automation.refine_daily_article

      - name: Commit refined daily article
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Daily article already refined."
            exit 0
          fi
          git config user.name "goriva.online bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/articles/daily media/daily-news
          git commit -m "Refine daily article editorial layout"
          git pull --rebase origin main
          git push origin main
