name: Fix homepage Leaflet map regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-home-map-regression.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix EKO lazy-loader guard and bust cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader = Path("scripts/home-map-loader.js")
          text = loader.read_text(encoding="utf-8")
          old = '''            await loadScript("/scripts/station-icons.js?v=20260830-1239", "goriva-station-icons");
            await loadScript("/scripts/ecopetrol_prices.js?v=20260906-eko-map1", "goriva-eko-map-data");'''
          new = '''            await loadScript("/scripts/station-icons.js?v=20260830-1239", "goriva-station-icons");

            // The loader sets __GORIVA_EKO_MAP_MODE__ early only to keep the
            // legacy map in script-base.js from taking ownership of #station-map.
            // Release that temporary guard immediately before the dedicated EKO
            // implementation loads; ecopetrol_prices.js will set it back to true
            // after its own one-time initialization guard has passed.
            window.__GORIVA_EKO_MAP_MODE__ = false;
            await loadScript("/scripts/ecopetrol_prices.js?v=20260906-eko-map1", "goriva-eko-map-data");'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Expected homepage map loader sequence not found")
              text = text.replace(old, new, 1)
              loader.write_text(text, encoding="utf-8")

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          old_ref = '/scripts/home-map-loader.js?v=20260906-perf1'
          new_ref = '/scripts/home-map-loader.js?v=20260906-mapfix1'
          if new_ref not in html:
              if old_ref not in html:
                  raise SystemExit("Expected homepage map loader reference not found")
              html = html.replace(old_ref, new_ref, 1)
              index.write_text(html, encoding="utf-8")
          PY

      - name: Verify map bootstrap contract
        shell: bash
        run: |
          grep -q 'window.__GORIVA_EKO_MAP_MODE__ = false;' scripts/home-map-loader.js
          grep -q 'home-map-loader.js?v=20260906-mapfix1' index.html
          grep -q 'if (window.__GORIVA_EKO_MAP_MODE__) return;' scripts/ecopetrol_prices.js
          grep -q 'window.__GORIVA_EKO_MAP_MODE__ = true;' scripts/ecopetrol_prices.js
          echo "Leaflet lazy-loader guard handoff verified."

      - name: Commit fix directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Map regression is already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/home-map-loader.js index.html
          git commit -m "Fix homepage Leaflet lazy-loader guard [skip ci]"
          git pull --rebase origin main
          git push origin main
