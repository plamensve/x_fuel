# Trigger after workflow registration
name: Polish cars consumer UX once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cars-consumer-ux-polish-once.yml"

permissions:
  contents: write

concurrency:
  group: cars-consumer-ux-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply consumer UX changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          OLD = '20260907-cars2'
          NEW = '20260907-cars3'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          for path in [
              'cars/index.html',
              'cars/new/index.html',
              'cars/my/index.html',
              'cars/edit/index.html',
              'cars/view/index.html',
          ]:
              text = read(path)
              text = text.replace(OLD, NEW)
              write(path, text)

          path = 'cars/my/index.html'
          text = read(path)
          old = '<div class="cars-hero-aside"><div class="cars-hero-stat"><strong>Сигурно управление</strong><span>Достъпът е свързан с твоя Supabase user ID</span></div></div>'
          new = '<div class="cars-hero-aside"><div class="cars-hero-stat"><strong>Всичко на едно място</strong><span>Редактирай обявите си, актуализирай информацията и отбелязвай продадените автомобили.</span></div><div class="cars-hero-stat"><strong>Бърз достъп</strong><span>Влизаш с еднократен код, без да помниш парола.</span></div></div>'
          text = must_replace(text, old, new, 'consumer hero on my listings')
          write(path, text)

          path = 'cars/new/index.html'
          text = read(path)
          old = '<div class="cars-auth-copy"><span class="cars-kicker" style="color:#2563eb">Сигурен достъп</span><h2>Вход за публикуване</h2><p>Използваме email OTP вместо парола. По този начин разпознаваме собственика на обявата и позволяваме редактиране само от неговия профил.</p></div>'
          new = '<div class="cars-auth-copy"><span class="cars-kicker" style="color:#2563eb">Бърз и сигурен вход</span><h2>Вход за публикуване</h2><p>Въведи своя email и ще получиш еднократен код за вход. Не е нужно да създаваш или помниш парола.</p></div>'
          text = must_replace(text, old, new, 'consumer auth copy on new listing')
          write(path, text)

          path = 'cars/index.html'
          text = read(path)
          old_heading = '''<section class="cars-panel">
    <div class="cars-panel-heading">
      <div><h2>Търси автомобил</h2><p>Филтрирай наличните обяви по основните критерии.</p></div>
    </div>'''
          new_heading = '''<section class="cars-panel cars-search-panel">
    <div class="cars-panel-heading cars-search-heading">
      <div class="cars-search-heading-copy"><span class="cars-search-eyebrow">Разширено търсене</span><h2>Търси автомобил</h2><p>Избери най-важните критерии и намери автомобилите, които отговарят на твоите изисквания.</p></div>
      <div class="cars-search-heading-badge" aria-hidden="true"><span>⌕</span><strong>Намери точния автомобил</strong></div>
    </div>'''
          text = must_replace(text, old_heading, new_heading, 'catalog search heading')
          color_field = '      <label class="cars-field"><span>Цвят</span><select id="cars-filter-color"><option value="">Всички цветове</option></select></label>\n'
          text = must_replace(text, color_field, '', 'catalog color filter')
          write(path, text)

          path = 'cars/cars.js'
          text = read(path)
          text = must_replace(
              text,
              ".select('id,title,make,model,year,price,mileage,fuel_type,transmission,engine_capacity,power_hp,drivetrain,body_type,color,condition,region,city,seller_name,created_at,is_featured')",
              ".select('id,title,make,model,year,price,mileage,fuel_type,transmission,engine_capacity,power_hp,drivetrain,body_type,condition,region,city,seller_name,created_at,is_featured')",
              'catalog select without color'
          )
          text = must_replace(text, "    const color = $('#cars-filter-color');\n", '', 'color filter variable')
          text = must_replace(text, "    setOptions(color, uniqueSorted(state.catalogRows.map(x => x.color)));\n", '', 'color filter options')
          text = must_replace(text, "    const color = value('#cars-filter-color');\n", '', 'color render variable')
          text = must_replace(text, "        (!color || row.color === color) &&\n", '', 'color render condition')

          render_pattern = re.compile(r"  function renderSelectedFiles\(input, target\) \{.*?\n  \}\n\n  function previewFiles", re.S)
          match = render_pattern.search(text)
          if not match:
              raise SystemExit('renderSelectedFiles function not found')
          replacement = '''  function renderSelectedFiles(input, target) {
    if (!input || !target) return;
    const files = input._carsSelectedFiles || [];
    target.innerHTML = '';
    files.forEach((file, index) => {
      const url = URL.createObjectURL(file);
      const item = document.createElement('div');
      item.className = 'cars-upload-preview-item';
      item.innerHTML = `<img src="${url}" alt="Преглед"><button class="cars-remove-upload" type="button" data-remove-file="${index}" aria-label="Премахни ${escapeHtml(file.name)}">×</button><span>${escapeHtml(file.name)}</span>`;
      target.appendChild(item);
    });

    if (files.length < MAX_IMAGES) {
      const addTile = document.createElement('label');
      addTile.className = 'cars-add-photo-tile';
      addTile.htmlFor = input.id;
      addTile.innerHTML = `<span class="cars-add-photo-icon" aria-hidden="true">+</span><strong>Добави снимки</strong><small>${files.length}/${MAX_IMAGES}</small>`;
      target.appendChild(addTile);
    }
  }

  function previewFiles'''
          text = text[:match.start()] + replacement + text[match.end():]
          text = must_replace(
              text,
              "    target.addEventListener('click', event => {\n",
              "    renderSelectedFiles(input, target);\n    target.addEventListener('click', event => {\n",
              'initial add-photo tile render'
          )
          write(path, text)

          path = 'cars/cars.css'
          text = read(path)
          anchor = '''.cars-filter-grid .cars-field { grid-column:span 3; }
.cars-filter-grid .cars-field.search,
.cars-filter-grid .cars-field.wide { grid-column:span 6; }
.cars-filter-actions { display:flex; align-items:flex-end; gap:8px; grid-column:span 3; }
'''
          enhanced = anchor + '''
.cars-search-panel {
  position:relative;
  overflow:hidden;
  border-color:#cbd9ea;
  background:
    radial-gradient(circle at 100% 0, rgba(37,99,235,.10), transparent 30%),
    linear-gradient(180deg,#ffffff 0%,#f7faff 100%);
  box-shadow:0 24px 58px rgba(15,23,42,.10);
}
.cars-search-panel::before {
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg,#2563eb 0%,#0ea5e9 48%,#0f766e 100%);
}
.cars-search-heading {
  position:relative;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid #e4ebf5;
}
.cars-search-heading-copy { max-width:760px; }
.cars-search-eyebrow {
  display:inline-flex;
  margin-bottom:7px;
  color:#2563eb;
  font-size:11px;
  font-weight:950;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.cars-search-heading-badge {
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border:1px solid #d7e3f4;
  border-radius:14px;
  background:rgba(255,255,255,.82);
  color:#334155;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
  white-space:nowrap;
}
.cars-search-heading-badge span {
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#0f766e);
  color:#fff;
  font-size:22px;
  font-weight:900;
}
.cars-search-heading-badge strong { font-size:13px; }
.cars-search-panel .cars-filter-grid { gap:16px 14px; }
.cars-search-panel .cars-field span { color:#475569; font-size:11px; letter-spacing:.055em; }
.cars-search-panel .cars-field input,
.cars-search-panel .cars-field select {
  min-height:50px;
  border-color:#c8d6e8;
  border-radius:13px;
  background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;
}
.cars-search-panel .cars-field input:hover,
.cars-search-panel .cars-field select:hover { border-color:#9fb8d8; }
.cars-search-panel .cars-field input:focus,
.cars-search-panel .cars-field select:focus {
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,.10),0 8px 20px rgba(15,23,42,.05);
}
.cars-search-panel .cars-filter-actions .cars-btn {
  min-height:50px;
  padding:0 22px;
  border-color:#b9c9de;
  background:#fff;
  box-shadow:0 6px 16px rgba(15,23,42,.05);
}
'''
          text = must_replace(text, anchor, enhanced, 'professional search styles')
          text = must_replace(
              text,
              '.cars-upload-box input[type=file] { width:100%; }',
              '.cars-upload-box input[type=file] { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; }',
              'hide native upload input'
          )
          upload_anchor = '.cars-remove-upload:hover { background:#b91c1c; }\n'
          upload_styles = upload_anchor + '''.cars-add-photo-tile {
  min-height:0;
  aspect-ratio:4/3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:2px dashed #7cb3f7;
  border-radius:12px;
  background:linear-gradient(145deg,#f8fbff,#edf5ff);
  color:#2563eb;
  cursor:pointer;
  text-align:center;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.cars-add-photo-tile:hover {
  transform:translateY(-2px);
  border-color:#2563eb;
  background:#fff;
  box-shadow:0 10px 24px rgba(37,99,235,.12);
}
.cars-add-photo-icon {
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  border-radius:999px;
  background:linear-gradient(135deg,#2563eb,#0f766e);
  color:#fff;
  font-size:34px;
  font-weight:500;
  line-height:1;
  box-shadow:0 8px 18px rgba(37,99,235,.20);
}
.cars-add-photo-tile strong { font-size:12px; }
.cars-add-photo-tile small { color:#64748b; font-size:10px; font-weight:800; }
'''
          text = must_replace(text, upload_anchor, upload_styles, 'add-photo tile styles')
          mobile_anchor = '  .cars-panel-heading { flex-direction:column; }\n'
          mobile_new = mobile_anchor + '  .cars-search-heading-badge { width:100%; box-sizing:border-box; justify-content:flex-start; white-space:normal; }\n'
          text = must_replace(text, mobile_anchor, mobile_new, 'mobile search heading')
          write(path, text)

          path = 'pages/styles/global-progress.css'
          text = read(path)
          old_prefix = '@media(min-width:901px){.goriva-stations-nav-item{margin-right:9px}'
          new_prefix = '@media(min-width:901px){.goriva-global-menu{gap:4px!important}.goriva-global-menu>a{margin:0 2px!important}.goriva-stations-nav-item{margin:0 8px 0 2px}'
          text = must_replace(text, old_prefix, new_prefix, 'desktop nav spacing')
          mobile_marker = '@media(max-width:900px){\n'
          desktop_wide = '''@media(min-width:1200px){
  .goriva-global-nav-shell{width:min(1480px,calc(100% - 32px))!important;max-width:1480px!important;gap:18px!important;padding-left:8px!important;padding-right:8px!important}
  .goriva-global-menu{gap:7px!important}
  .goriva-global-menu>a{padding-left:12px!important;padding-right:12px!important}
  .goriva-stations-nav-toggle{padding-left:12px!important;padding-right:12px!important}
}
'''
          text = must_replace(text, mobile_marker, desktop_wide + mobile_marker, 'wide desktop navigation')
          write(path, text)

          for path in ['scripts/global-nav.js', 'scripts/script.js']:
              text = read(path).replace(OLD, NEW)
              write(path, text)

          path = 'pages/business-clients.html'
          text = read(path).replace(OLD, NEW)
          write(path, text)
          PY

      - name: Validate JavaScript and changes
        shell: bash
        run: |
          node --check cars/cars.js
          node --check scripts/global-nav.js
          node --check scripts/script.js
          if grep -R -E "Supabase user ID|email OTP" cars/*.html cars/*/index.html; then exit 1; fi
          git diff --check
          git diff --stat

      - name: Remove one-time workflow and commit to main
        shell: bash
        run: |
          rm .github/workflows/cars-consumer-ux-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars pages/styles/global-progress.css pages/business-clients.html scripts/global-nav.js scripts/script.js .github/workflows/cars-consumer-ux-polish-once.yml
          git commit -m "Polish car marketplace consumer UX"
          git pull --rebase origin main
          git push origin main
