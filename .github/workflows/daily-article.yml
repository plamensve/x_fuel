name: Generate daily fuel article

on:
  workflow_dispatch:
    inputs:
      article_date:
        description: "Optional date in YYYY-MM-DD. Leave empty to use the latest viable day."
        required: false
        type: string
  schedule:
    # Sofia is UTC+3 in summer and UTC+2 in winter.
    # Both UTC candidates are scheduled; the gate below runs only at local 18:00.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Sofia publication window
        id: window
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          now = datetime.now(ZoneInfo("Europe/Sofia"))
          should_run = event == "workflow_dispatch" or now.hour == 18
          print(f"Sofia time: {now.isoformat()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"sofia_date={now.date().isoformat()}\n")
          PY

      - name: Checkout repository
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: pip install -r requirements-automation.txt

      - name: Resolve article date
        if: steps.window.outputs.should_run == 'true'
        id: article
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.article_date }}
          SOFIA_DATE: ${{ steps.window.outputs.sofia_date }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TARGET_DATE="${SOFIA_DATE}"
          else
            TARGET_DATE="${MANUAL_DATE}"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target article date: ${TARGET_DATE:-latest viable day}"

      - name: Generate Bulgarian daily article
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: |
          python - <<'PY'
          import re
          import automation.generate_daily_article_bg as base

          MIN_CITY_RANKING_COUNT = 10
          META_DESCRIPTION_MAX = 155

          original_summarize_day = base.summarize_day
          original_render_article = base.render_article

          def summarize_day(rows):
              summary = original_summarize_day(rows)
              summary["city_averages"] = [
                  item
                  for item in summary.get("city_averages", [])
                  if int(item.get("count", 0)) >= MIN_CITY_RANKING_COUNT
              ]
              return summary

          def smart_meta_description(text, max_len=META_DESCRIPTION_MAX):
              clean = re.sub(r"\s+", " ", str(text or "")).strip()
              if len(clean) <= max_len:
                  return clean

              window = clean[:max_len + 1]
              sentence_breaks = [m.end() for m in re.finditer(r"[.!?](?=\s|$)", window)]
              usable_breaks = [pos for pos in sentence_breaks if pos >= 90]
              if usable_breaks:
                  return window[:usable_breaks[-1]].strip()

              cut = window.rsplit(" ", 1)[0].rstrip(" ,;:-")
              if len(cut) > max_len - 1:
                  cut = cut[:max_len - 1].rsplit(" ", 1)[0].rstrip(" ,;:-")
              return cut + "…"

          def render_article(date_str, article):
              safe_article = dict(article)
              safe_article["description"] = smart_meta_description(
                  safe_article.get("description", "")
              )
              return original_render_article(date_str, safe_article)

          base.summarize_day = summarize_day
          base.render_article = render_article
          base.main()
          PY

      - name: Generate article artwork and update news cards
        if: steps.window.outputs.should_run == 'true'
        env:
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python automation/postprocess_daily_article.py

      - name: Commit generated article
        if: steps.window.outputs.should_run == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "goriva.online bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/articles/daily pages/news.html data/generated-news.json sitemap.xml media/daily-news
          git commit -m "Publish daily fuel market article"
          git push
