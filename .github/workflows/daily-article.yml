name: Generate daily fuel article

on:
  workflow_dispatch:
    inputs:
      article_date:
        description: "Optional date in YYYY-MM-DD. Leave empty to use the latest viable day."
        required: false
        type: string
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Sofia publication window
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          now = datetime.now(ZoneInfo("Europe/Sofia"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)

          if event == "workflow_dispatch":
              should_run = True
          elif offset_hours == 3:
              should_run = schedule == "0 15 * * *"
          else:
              should_run = schedule == "0 16 * * *"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"sofia_date={now.date().isoformat()}\n")
          PY

      - name: Checkout repository
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: pip install -r requirements-automation.txt

      - name: Resolve article date
        if: steps.window.outputs.should_run == 'true'
        id: article
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.article_date }}
          SOFIA_DATE: ${{ steps.window.outputs.sofia_date }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TARGET_DATE="${SOFIA_DATE}"
          else
            TARGET_DATE="${MANUAL_DATE}"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target article date: ${TARGET_DATE:-latest viable day}"

      - name: Generate Bulgarian daily article
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: |
          python - <<'PY'
          import re
          from datetime import datetime
          import automation.generate_daily_article_bg as base
          import automation.generate_daily_article_longform as longform

          MIN_CITY_RANKING_COUNT = 3
          META_DESCRIPTION_MAX = 155
          MAX_GENERATION_ATTEMPTS = 3
          MAJOR_CITIES = ("София", "Пловдив", "Варна", "Бургас", "Русе", "Стара Загора")

          base.SOURCE_MAX_AGE_HOURS = 168
          base.PREFERRED_BG_SOURCES = tuple(dict.fromkeys(base.PREFERRED_BG_SOURCES + (
              "forbesbulgaria.com", "profit.bg", "manager.bg", "bloombergtv.bg",
              "24chasa.bg", "trud.bg", "segabg.com", "offnews.bg"
          )))

          original_summarize_day = base.summarize_day
          original_render_article = base.render_article
          original_build_facts = base.build_facts

          def fmt_price_2(value):
              return f"{float(value):.2f}".replace(".", ",")

          def fmt_change_2(value):
              numeric = float(value)
              sign = "+" if numeric > 0 else ""
              return sign + f"{numeric:.2f}".replace(".", ",")

          def bg_date(date_str):
              months = ["януари", "февруари", "март", "април", "май", "юни", "юли", "август", "септември", "октомври", "ноември", "декември"]
              dt = datetime.fromisoformat(date_str)
              return f"{dt.day} {months[dt.month - 1]} {dt.year}"

          def seo_title(date_str):
              return f"Цени на горивата днес: София и големите градове – {bg_date(date_str)}"

          def summarize_day(rows):
              summary = original_summarize_day(rows)
              summary["city_averages"] = [
                  item for item in summary.get("city_averages", [])
                  if int(item.get("count", 0)) >= MIN_CITY_RANKING_COUNT
              ]
              return summary

          def build_facts(target, current, previous_day, previous):
              facts = original_build_facts(target, current, previous_day, previous)
              major_cities = {}
              for city in MAJOR_CITIES:
                  fuel_rows = {}
                  for item in current.get("city_averages", []):
                      if str(item.get("city", "")).strip().lower() != city.lower():
                          continue
                      fuel = item.get("fuel")
                      if fuel:
                          fuel_rows[fuel] = {
                              "average": item.get("average"),
                              "count": item.get("count"),
                              "display_average": fmt_price_2(item.get("average", 0)),
                          }
                  major_cities[city] = fuel_rows
              facts["major_cities"] = major_cities
              facts["editorial_brief"] = {
                  "seo_title_rule": "Use a natural consumer-facing SEO title. Never use 'наблюдаваната извадка' in the title.",
                  "target_length_words": "1500-2500 when enough material exists",
                  "minimum_sources_when_available": 4,
                  "required_city_sections": list(MAJOR_CITIES),
                  "style": [
                      "Do not repeatedly remind readers that the data is a sample. One concise methodology note is enough.",
                      "All reader-facing fuel prices use exactly two decimals.",
                      "Write for drivers, not analysts: explain practical price differences between cities and fuels.",
                      "Use the major city sections as substantive parts of the article, not token one-sentence mentions.",
                  ],
              }
              return facts

          def smart_meta_description(text, max_len=META_DESCRIPTION_MAX):
              clean = re.sub(r"\s+", " ", str(text or "")).strip()
              if len(clean) <= max_len:
                  return clean
              window = clean[:max_len + 1]
              sentence_breaks = [m.end() for m in re.finditer(r"[.!?](?=\s|$)", window)]
              usable_breaks = [pos for pos in sentence_breaks if pos >= 90]
              if usable_breaks:
                  return window[:usable_breaks[-1]].strip()
              cut = window.rsplit(" ", 1)[0].rstrip(" ,;:-")
              return cut[:max_len - 1].rsplit(" ", 1)[0].rstrip(" ,;:-") + "…"

          def render_article(date_str, article):
              safe_article = dict(article)
              safe_article["title"] = seo_title(date_str)
              safe_article["description"] = smart_meta_description(safe_article.get("description", ""))
              return original_render_article(date_str, safe_article)

          def generate_article(facts):
              last_error = None
              retryable_markers = (
                  "local decimal numbers are not present in prepared facts",
                  "external context must stay qualitative",
              )
              for attempt in range(1, MAX_GENERATION_ATTEMPTS + 1):
                  article = longform.generate_article(facts)
                  article["title"] = seo_title(facts["date"])
                  article["body_html"] = base.sanitize_body(article.get("body_html", ""))
                  try:
                      base.validate_article(article, facts)
                      return article
                  except RuntimeError as exc:
                      last_error = exc
                      message = str(exc)
                      if not any(marker in message for marker in retryable_markers):
                          raise
                      print(f"Draft failed numeric guardrails on attempt {attempt}/{MAX_GENERATION_ATTEMPTS}: {message}")
              raise RuntimeError(f"Publication stopped after repeated validation failures. Last error: {last_error}")

          base.fmt_price = fmt_price_2
          base.fmt_change = fmt_change_2
          base.summarize_day = summarize_day
          base.build_facts = build_facts
          base.render_article = render_article
          base.generate_article = generate_article
          base.main()
          PY

      - name: Generate hero image and update news cards
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python -m automation.postprocess_daily_article

      - name: Generate city charts and inline AI images
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python -m automation.enrich_daily_article_visuals

      - name: Finalize reader-facing layout
        if: steps.window.outputs.should_run == 'true'
        env:
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python -m automation.finalize_daily_article

      - name: Commit generated article
        if: steps.window.outputs.should_run == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "goriva.online bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/articles/daily pages/news.html data/generated-news.json sitemap.xml media/daily-news
          git commit -m "Publish daily fuel market article"
          git push
