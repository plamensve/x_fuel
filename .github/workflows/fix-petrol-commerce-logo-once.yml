name: Fix Petrol Commerce logo once

on:
  push:
    paths:
      - .github/workflows/fix-petrol-commerce-logo-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run one-time Petrol Commerce logo fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch logo resolvers
        shell: python
        run: |
          from pathlib import Path

          EXCLUDED = '["петролкомерс", "petrolcommerce", "petrolkomers"]'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Daily price cards/table: Petrol Commerce must never inherit Petrol's SVG.
          replace_once(
              "scripts/script-base.js",
              '        .trim()\n\n    const rules = [',
              '        .trim()\n\n    if (' + EXCLUDED + '.some(alias => normalized.includes(alias))) return null\n\n    const rules = ['
          )

          # Shared resolver loaded before the legacy renderer.
          replace_once(
              "scripts/eko-fallback-efficient.js",
              '        if (!normalized) return null;\n\n        const rule = stationLogoRules.find(item =>',
              '        if (!normalized) return null;\n        if (' + EXCLUDED + '.some(alias => normalized.includes(alias))) return null;\n\n        const rule = stationLogoRules.find(item =>'
          )

          # Homepage Top 4 cards use their own resolver; show unknown rather than Petrol.
          replace_once(
              "scripts/eco_filter.js",
              '        .replace(/\\s+/g, " ")\n        .trim();\n\n    const config = HOME_STATION_LOGOS.find(item => item.match.some(token => normalized.includes(token)));',
              '        .replace(/\\s+/g, " ")\n        .trim();\n\n    const compact = normalized.replace(/[\\s\\-_.]+/g, "");\n    if (' + EXCLUDED + '.some(alias => compact.includes(alias))) {\n        return "images/station_logos/unknown.svg";\n    }\n\n    const config = HOME_STATION_LOGOS.find(item => item.match.some(token => normalized.includes(token)));'
          )

          # Leaflet station icons: prevent the same false brand match on the map.
          replace_once(
              "scripts/station-icons.js",
              '    let defaultConfig = {\n        iconSize: [42, 42],\n        iconAnchor: [21, 42],\n        popupAnchor: [0, -42]\n    }\n\n    if (lower.includes("ecopetrol")',
              '    let defaultConfig = {\n        iconSize: [42, 42],\n        iconAnchor: [21, 42],\n        popupAnchor: [0, -42]\n    }\n\n    if (' + EXCLUDED + '.some(alias => lower.includes(alias))) {\n        return L.icon({iconUrl: "../images/station_logos/unknown.svg", ...defaultConfig})\n    }\n\n    if (lower.includes("ecopetrol")'
          )

          # Bust browser/CDN cache for the scripts that changed.
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          replacements = {
              '/scripts/eko-fallback-efficient.js?v=20260906-3': '/scripts/eko-fallback-efficient.js?v=20260907-petrol-commerce1',
              '/scripts/script-base.js?v=20260907-logo-fix1': '/scripts/script-base.js?v=20260907-logo-fix2',
              'scripts/eco_filter.js?v=20260830-1239': 'scripts/eco_filter.js?v=20260907-petrol-commerce1',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f"Expected index cache-bust pattern not found: {old}")
              html = html.replace(old, new, 1)
          index.write_text(html, encoding="utf-8")

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/script-base.js
          node --check scripts/eko-fallback-efficient.js
          node --check scripts/eco_filter.js
          node --check scripts/station-icons.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/script-base.js scripts/eko-fallback-efficient.js scripts/eco_filter.js scripts/station-icons.js index.html
          git commit -m "Fix Petrol Commerce logo collision"
          git push
