name: Diagnose EKO price feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-eko-prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public Supabase price feed
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = 'https://eaqvhxfvozhzatrnbkvx.supabase.co/rest/v1/fuel_prices'
          key = 'sb_publishable_u4ymkO5tFBauze0rVOkf-Q_kvbiIdwH'

          def query(params, label, count=False):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'apikey': key, **({'Prefer':'count=exact'} if count else {})})
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = r.read().decode('utf-8')
                  print(f'[{label}] status={r.status} content-range={r.headers.get("Content-Range")}')
                  data = json.loads(body)
                  print(f'[{label}] rows={len(data)}')
                  for row in data[:20]:
                      print(json.dumps(row, ensure_ascii=False, sort_keys=True))
                  return data

          for value, label in [
              ('eq.ЕКО', 'exact-cyrillic'),
              ('eq.EKO', 'exact-latin-upper'),
              ('eq.Eko', 'exact-latin-title'),
              ('ilike.*EKO*', 'ilike-latin'),
              ('ilike.*ЕКО*', 'ilike-cyrillic'),
          ]:
              query({
                  'select':'station,location,city,region,fuel,price,created_at',
                  'station': value,
                  'order':'created_at.desc',
                  'limit':'20',
              }, label, True)

          rows = query({
              'select':'station',
              'order':'station.asc',
              'limit':'1000',
          }, 'station-sample')
          names = sorted({str(row.get('station')) for row in rows})
          print('[distinct-stations]', json.dumps(names, ensure_ascii=False))
          PY
