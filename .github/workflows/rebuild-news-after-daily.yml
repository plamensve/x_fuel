name: Rebuild news hub after daily article

on:
  workflow_run:
    workflows: ["Generate daily fuel article"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild unified news page
        run: |
          python -m automation.rebuild_news_page
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/news.html')
          text = path.read_text(encoding='utf-8')
          href = 'styles/news-latest.css?v=20260831-1'
          if href not in text:
              text = text.replace('</head>', f'<link rel="stylesheet" href="{href}">\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit news page
        run: |
          if git diff --quiet; then
            echo "News hub already up to date."
            exit 0
          fi
          git config user.name "goriva.online bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/news.html
          git commit -m "Refresh unified news hub"
          git pull --rebase origin main
          git push origin main
