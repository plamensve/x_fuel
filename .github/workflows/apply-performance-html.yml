name: Apply performance HTML hardening

on:
  push:
    branches: ["perf/site-speed-audit-20260906"]
    paths:
      - ".github/workflows/apply-performance-html.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move non-critical frontend resources off the critical path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def write_if_changed(path, text):
              current = path.read_text(encoding="utf-8")
              if current != text:
                  path.write_text(text, encoding="utf-8")
                  return True
              return False

          changed = []

          # Homepage: replace eager Leaflet/MarkerCluster/EKO scripts with the
          # viewport-aware local loader. The visual map shell stays unchanged.
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          for pattern in [
              r'^\s*<link[^>]+href="https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.css"[^>]*>\s*$',
              r'^\s*<link[^>]+href="https://unpkg\.com/leaflet\.markercluster/dist/MarkerCluster\.css"[^>]*>\s*$',
              r'^\s*<link[^>]+href="https://unpkg\.com/leaflet\.markercluster/dist/MarkerCluster\.Default\.css"[^>]*>\s*$',
              r'^\s*<link[^>]+rel="preconnect"[^>]+href="https://unpkg\.com"[^>]*>\s*$',
              r'^\s*<script[^>]+src="https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.js"[^>]*></script>\s*$',
              r'^\s*<script[^>]+src="https://unpkg\.com/leaflet\.markercluster/dist/leaflet\.markercluster\.js"[^>]*></script>\s*$',
              r'^\s*<script[^>]+src="scripts/station-icons\.js[^\"]*"[^>]*></script>\s*$',
              r'^\s*<script[^>]+src="scripts/ecopetrol_prices\.js[^\"]*"[^>]*></script>\s*$',
          ]:
              html = re.sub(pattern, "", html, flags=re.M)

          loader = '<script defer src="/scripts/home-map-loader.js?v=20260906-perf1"></script>'
          if loader not in html:
              match = re.search(r'<script defer src="scripts/home-nav-modern\.js[^\"]*"></script>', html)
              if not match:
                  raise SystemExit("Homepage map loader insertion anchor not found")
              html = html[:match.start()] + loader + "\n" + html[match.start():]
          if write_if_changed(path, html): changed.append(str(path))

          # Utility and weather pages: analytics is owned by consent-manager.js.
          # Remove the legacy eager GA bootstrap and make bottom scripts deferred.
          for filename in ["pages/useful.html", "pages/weather.html"]:
              path = Path(filename)
              html = path.read_text(encoding="utf-8")
              html = re.sub(
                  r'\s*<script\s+async\s+src="https://www\.googletagmanager\.com/gtag/js\?id=G-F6YJNGGFR2"></script>\s*'
                  r'<script>\s*window\.dataLayer\s*=\s*window\.dataLayer\s*\|\|\s*\[\];.*?gtag\(\'config\',\s*\'G-F6YJNGGFR2\'\);\s*</script>\s*',
                  "\n",
                  html,
                  flags=re.S,
              )
              html = re.sub(r'<script\s+src="(https://unpkg\.com/leaflet[^\"]+\.js)"></script>', r'<script defer src="\1"></script>', html)
              html = re.sub(r'<script\s+src="(https://unpkg\.com/leaflet\.markercluster[^\"]+\.js)"></script>', r'<script defer src="\1"></script>', html)
              html = re.sub(r'<script\s+src="(\.\./scripts/(?:station-icons|useful|weather)\.js[^\"]*)"></script>', r'<script defer src="\1"></script>', html)
              html = re.sub(r'<script\s+src="(/scripts/script\.js[^\"]*)"></script>', r'<script defer src="\1"></script>', html)
              if write_if_changed(path, html): changed.append(str(path))

          def remove_legacy_hotjar_adsense(html):
              html = re.sub(
                  r'\s*<script>\s*\(function \(h, o, t, j, a, r\) \{.*?static\.hotjar\.com.*?</script>\s*',
                  "\n",
                  html,
                  flags=re.S,
              )
              html = re.sub(
                  r'\s*<script\s+async\s+src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-3478773231642095"\s+crossorigin="anonymous"></script>\s*',
                  "\n",
                  html,
              )
              return html

          # History and business pages still had old eager Hotjar + AdSense in
          # <head>. Their shared global navigation already loads consent-manager.
          for filename in ["pages/trends.html", "pages/business-clients.html"]:
              path = Path(filename)
              html = remove_legacy_hotjar_adsense(path.read_text(encoding="utf-8"))
              if filename.endswith("trends.html"):
                  html = re.sub(r'\s*<link rel="stylesheet" href="styles/site-shell\.css">\s*', "\n", html)
                  html = html.replace('<script data-name="BMC-Widget"', '<script async data-name="BMC-Widget"', 1)
              if write_if_changed(path, html): changed.append(str(path))

          print("Changed:", ", ".join(changed) if changed else "none")
          PY

      - name: Verify performance hardening
        shell: bash
        run: |
          grep -q 'home-map-loader.js?v=20260906-perf1' index.html
          ! grep -q 'src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"' index.html
          ! grep -q 'googletagmanager.com/gtag/js?id=G-F6YJNGGFR2' pages/useful.html
          ! grep -q 'googletagmanager.com/gtag/js?id=G-F6YJNGGFR2' pages/weather.html
          ! grep -q 'static.hotjar.com/c/hotjar-' pages/trends.html
          ! grep -q 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' pages/trends.html
          ! grep -q 'static.hotjar.com/c/hotjar-' pages/business-clients.html
          ! grep -q 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' pages/business-clients.html
          grep -q '<script defer src="../scripts/weather.js' pages/weather.html
          grep -q '<script defer src="../scripts/useful.js' pages/useful.html

      - name: Commit generated HTML changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/useful.html pages/weather.html pages/trends.html pages/business-clients.html
          git commit -m "Move non-critical frontend resources off critical path [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
