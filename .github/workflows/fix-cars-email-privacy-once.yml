name: Fix cars contact privacy once

on:
  push:
    paths:
      - .github/workflows/fix-cars-email-privacy-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time cars contact privacy fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep login email private unless seller enters a contact email
        shell: python
        run: |
          from pathlib import Path
          path = Path('cars/cars.js')
          text = path.read_text(encoding='utf-8')
          old = "seller_email: value('seller_email') || state.user?.email || null"
          new = "seller_email: value('seller_email') || null"
          if old not in text:
              raise SystemExit('Expected seller_email pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate JavaScript
        run: node --check cars/cars.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars/cars.js
          git commit -m "Keep car marketplace login email private"
          git push
