name: Apply technical SEO improvements

on:
  push:
    branches:
      - main
    paths:
      - "automation/apply_technical_seo.py"
      - "automation/rebuild_sitemap.py"
      - ".github/workflows/apply-technical-seo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technical-seo-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply non-visual SEO improvements
        run: PYTHONPATH=. python automation/apply_technical_seo.py

      - name: Show changed files
        run: git status --short

      - name: Commit SEO changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No technical SEO changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml pages automation/generate_daily_article_bg.py automation/generate_sofia_article.py automation/rebuild_news_page.py
          git commit -m "Apply non-visual technical SEO improvements [skip ci]"
          git push
