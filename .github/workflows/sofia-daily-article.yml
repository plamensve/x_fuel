name: Generate Sofia fuel article

on:
  workflow_dispatch:
    inputs:
      article_date:
        description: "Optional date in YYYY-MM-DD. Leave empty to use the latest viable Sofia dataset."
        required: false
        type: string
  schedule:
    - cron: "20 15 * * *"
    - cron: "20 16 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Sofia publication window
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          now = datetime.now(ZoneInfo("Europe/Sofia"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)

          if event == "workflow_dispatch":
              should_run = True
          elif offset_hours == 3:
              should_run = schedule == "20 15 * * *"
          else:
              should_run = schedule == "20 16 * * *"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"sofia_date={now.date().isoformat()}\n")
          PY

      - name: Checkout repository
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: pip install -r requirements-automation.txt

      - name: Resolve article date
        if: steps.window.outputs.should_run == 'true'
        id: article
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.article_date }}
          SOFIA_DATE: ${{ steps.window.outputs.sofia_date }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TARGET_DATE="${SOFIA_DATE}"
          else
            TARGET_DATE="${MANUAL_DATE}"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target Sofia article date: ${TARGET_DATE:-latest viable day}"

      - name: Generate Sofia fuel-price article
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
          SOURCE_MAX_AGE_HOURS: "72"
          MIN_SOFIA_RECORDS: "20"
          MIN_SOFIA_STATIONS: "8"
        run: python -m automation.generate_sofia_article

      - name: Commit generated Sofia article
        if: steps.window.outputs.should_run == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "goriva.online bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/articles/sofia sitemap.xml
          git commit -m "Publish Sofia fuel price article"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
