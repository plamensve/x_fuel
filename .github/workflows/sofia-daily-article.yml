name: Generate Sofia fuel article

on:
  workflow_dispatch:
    inputs:
      article_date:
        description: "Optional date in YYYY-MM-DD. Leave empty to use the latest viable Sofia dataset."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check Sofia publication window
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("EVENT_SCHEDULE", "")
          now = datetime.now(ZoneInfo("Europe/Sofia"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)
          if event == "workflow_dispatch":
              should_run = True
          elif offset_hours == 3:
              should_run = schedule == "20 15 * * *"
          else:
              should_run = schedule == "20 16 * * *"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"sofia_date={now.date().isoformat()}\n")
          PY

      - name: Checkout repository
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-automation.txt

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: pip install -r requirements-automation.txt

      - name: Resolve article date
        if: steps.window.outputs.should_run == 'true'
        id: article
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.article_date }}
          SOFIA_DATE: ${{ steps.window.outputs.sofia_date }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TARGET_DATE="${SOFIA_DATE}"
          else
            TARGET_DATE="${MANUAL_DATE}"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target Sofia article date: ${TARGET_DATE:-latest viable day}"

      - name: Generate Sofia fuel-price article
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
          SOURCE_MAX_AGE_HOURS: "72"
          MIN_SOFIA_RECORDS: "20"
          MIN_SOFIA_STATIONS: "8"
        run: python -m automation.generate_sofia_article

      - name: Build professional layout and editorial visuals
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python -m automation.enrich_sofia_article

      - name: Add sharing and like controls
        if: steps.window.outputs.should_run == 'true'
        env:
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python -m automation.add_sofia_engagement

      - name: Remove charts and add section images
        if: steps.window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: python -m automation.refine_sofia_article

      - name: Register Sofia article in news manifest
        if: steps.window.outputs.should_run == 'true'
        env:
          ARTICLE_DATE: ${{ steps.article.outputs.target_date }}
        run: |
          python - <<'PY'
          import html, json, os, re
          from pathlib import Path
          root = Path('.')
          date = os.environ.get('ARTICLE_DATE','').strip()
          if not date:
              candidates = sorted(p.parent.name for p in (root/'pages/articles/sofia').glob('*/index.html'))
              if not candidates:
                  raise SystemExit('No Sofia article found')
              date = candidates[-1]
          path = root/'pages/articles/sofia'/date/'index.html'
          text = path.read_text(encoding='utf-8')
          def grab(pattern, fallback=''):
              m = re.search(pattern, text, flags=re.I|re.S)
              return html.unescape(re.sub(r'<[^>]+>', ' ', m.group(1)).strip()) if m else fallback
          title = grab(r'<h1[^>]*>(.*?)</h1>', f'Цените на горивата днес в София – {date}')
          description = grab(r'<meta\s+name="description"\s+content="([^"]*)"', '')
          hero = f'/media/sofia-news/{date}/hero.png'
          manifest_path = root/'data/generated-news.json'
          items = json.loads(manifest_path.read_text(encoding='utf-8')) if manifest_path.exists() else []
          url = f'/pages/articles/sofia/{date}/'
          items = [x for x in items if x.get('url') != url]
          items.append({'date': date, 'title': title, 'description': description, 'url': url, 'type': 'sofia', 'label': 'София', 'image': hero})
          items.sort(key=lambda x: (x.get('date',''), x.get('url','')), reverse=True)
          manifest_path.write_text(json.dumps(items[:120], ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Rebuild news hub
        if: steps.window.outputs.should_run == 'true'
        run: python -m automation.rebuild_news_page

      - name: Commit generated Sofia article
        if: steps.window.outputs.should_run == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "goriva.online bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/articles/sofia pages/news.html data/generated-news.json sitemap.xml media/sofia-news
          git commit -m "Publish professional Sofia fuel price article"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
