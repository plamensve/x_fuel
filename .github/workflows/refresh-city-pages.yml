name: Refresh permanent city price pages

on:
  workflow_dispatch:
  schedule:
    - cron: "35 10 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-city-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Sofia, Plovdiv and Varna pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python automation/generate_city_pages.py
          python automation/rebuild_sitemap.py
      - name: Commit refreshed city data
        run: |
          if git diff --quiet -- cities sitemap.xml; then
            echo "City pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cities sitemap.xml
          git commit -m "Refresh permanent city price pages"
          git push
