name: Apply homepage performance hotfix

on:
  push:
    paths:
      - '.github/workflows/performance-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage critical loading path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Third-party analytics/ads must not compete with first paint and are
          # now loaded by consent-manager.js only after the relevant consent.
          text = re.sub(
              r'\n\s*<script async src="https://www\.googletagmanager\.com/gtag/js\?id=G-F6YJNGGFR2"></script>\s*<script>.*?gtag\(\x27config\x27, \x27G-F6YJNGGFR2\x27\);\s*</script>',
              '', text, flags=re.S
          )
          text = re.sub(
              r'\n\s*<script async\s+src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-3478773231642095"\s+crossorigin="anonymous"></script>',
              '', text, flags=re.S
          )
          text = re.sub(
              r'\n\s*<script>\s*\(function \(h, o, t, j, a, r\) \{.*?static\.hotjar\.com/c/hotjar-.*?</script>',
              '', text, flags=re.S
          )

          # Large below-the-fold images should not be fetched with critical assets.
          text = text.replace(
              '<img src="media/business-clients-banner.png" alt="Анализ на разходите за гориво за бизнес клиенти">',
              '<img src="media/business-clients-banner.png" alt="Анализ на разходите за гориво за бизнес клиенти" loading="lazy" decoding="async" fetchpriority="low">'
          )
          text = text.replace(
              '<img src="media/plamen.jpg" alt="Пламен Светославов">',
              '<img src="media/plamen.jpg" alt="Пламен Светославов" loading="lazy" decoding="async">'
          )

          old_scripts = '''<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
          <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
          <script src="scripts/home-nav-modern.js?v=20260830-1645"></script>
          <script src="scripts/station-icons.js?v=20260830-1239"></script>
          <script src="/scripts/eko-fallback-efficient.js?v=20260906-nav-order1"></script>
          <script src="/scripts/script.js?v=20260906-nav-order1"></script>
          <script src="scripts/ecopetrol_prices.js?v=20260830-1239"></script>
          <script src="scripts/eco_filter.js?v=20260830-1239"></script>
          <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="qwan" data-description="Подкрепете goriva.online" data-message="Ако goriva.online Ви е полезен, можете да подкрепите развитието на проекта." data-color="#FF813F" data-position="Right" data-x_margin="18" data-y_margin="10"></script>'''

          new_scripts = '''<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
          <script defer src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
          <script defer src="scripts/home-nav-modern.js?v=20260830-1645"></script>
          <script defer src="scripts/station-icons.js?v=20260830-1239"></script>
          <script defer id="goriva-performance-guard" src="/scripts/performance-guard.js?v=20260906-3"></script>
          <script defer src="/scripts/eko-fallback-efficient.js?v=20260906-3"></script>
          <script defer id="goriva-script-base" src="/scripts/script-base.js?v=20260906-3"></script>
          <script defer id="goriva-home-hero-map" src="/scripts/home-hero-map-pro.js?v=20260906-3"></script>
          <script defer id="goriva-home-about-modern" src="/scripts/home-about-modern.js?v=20260906-3"></script>
          <script defer src="/scripts/script.js?v=20260906-3"></script>
          <script defer src="scripts/ecopetrol_prices.js?v=20260830-1239"></script>
          <script defer src="scripts/eco_filter.js?v=20260830-1239"></script>
          <script>
          window.addEventListener('load', () => setTimeout(() => {
              if (document.querySelector('script[data-name="BMC-Widget"]')) return;
              const s = document.createElement('script');
              s.dataset.name = 'BMC-Widget';
              s.dataset.cfasync = 'false';
              s.src = 'https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js';
              s.dataset.id = 'qwan';
              s.dataset.description = 'Подкрепете goriva.online';
              s.dataset.message = 'Ако goriva.online Ви е полезен, можете да подкрепите развитието на проекта.';
              s.dataset.color = '#FF813F';
              s.dataset.position = 'Right';
              s.dataset.x_margin = '18';
              s.dataset.y_margin = '10';
              document.body.appendChild(s);
          }, 1200), { once: true });
          </script>'''

          if old_scripts not in text:
              raise SystemExit('Expected homepage script block was not found; refusing unsafe patch')
          text = text.replace(old_scripts, new_scripts)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit performance hotfix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize homepage critical loading path"
          git push
