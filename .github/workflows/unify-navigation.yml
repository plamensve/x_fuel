name: Unify navigation references

on:
  push:
    branches: [main]
    paths:
      - "automation/unify_navigation.py"
      - ".github/workflows/unify-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unify-navigation
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize navigation references
        run: PYTHONPATH=. python automation/unify_navigation.py

      - name: Show changed files
        run: git status --short

      - name: Commit navigation normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation references already unified."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages stations scripts automation
          git commit -m "Unify site navigation references [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
